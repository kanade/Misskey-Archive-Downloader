name: Build Desktop App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Set artifact timestamp to JST (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $jst = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'Tokyo Standard Time')
          $f = "src-tauri/target/${{ matrix.target }}/release/misskey-archive-downloader.exe"
          if (Test-Path $f) { (Get-Item $f).LastWriteTime = $jst }

      - name: Set artifact timestamp to JST (macOS)
        if: runner.os == 'macOS'
        run: |
          find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" \
            -exec touch -t "$(TZ=Asia/Tokyo date +%Y%m%d%H%M.%S)" {} \;

      - name: Upload portable exe (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: misskey-archive-downloader-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/misskey-archive-downloader.exe
          if-no-files-found: ignore

      - name: Upload dmg (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: misskey-archive-downloader-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  # Publish all binaries to a rolling "latest" release with fixed asset names,
  # so the app can link to stable download URLs.
  release-latest:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release-latest
      cancel-in-progress: false
    steps:
      # Checked out first: checkout cleans the workspace, which would remove the downloaded artifacts.
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename to fixed asset names
        run: |
          mkdir -p release
          zip -j release/Windows-x64.zip \
            artifacts/misskey-archive-downloader-windows-x64/misskey-archive-downloader.exe || true
          find artifacts/misskey-archive-downloader-macos-x64 -name '*.dmg' \
            -exec cp {} release/macos-x64.dmg \; || true
          find artifacts/misskey-archive-downloader-macos-arm64 -name '*.dmg' \
            -exec cp {} release/macos-arm64.dmg \; || true

      # The viewer for replacing index.html of existing archives. Its version is numbered the same way
      # as the app builds (scripts/bump-version.mjs).
      - name: Build viewer (index.html.zip)
        run: |
          node scripts/bump-version.mjs
          node scripts/build-viewer.mjs dist-viewer
          zip -j release/index.html.zip dist-viewer/index.html
          ls -la release

      # Updating a release in place keeps its original publish date and tag commit,
      # so the release and its tag are deleted and created again for each build.
      - name: Delete previous "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest > /dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
          fi

      - name: Create rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest build
          body: |
            Misskey のノートとドライブのファイルを、ブラウザで見られるアーカイブ（ZIP）にまとめるツールのデスクトップ版です。
            このリリースのファイルは、GitHub Actions がコミット ${{ github.sha }} からビルドしたものです。

            ## ファイル

            - `Windows-x64.zip` … Windows（x64）版。解凍して `misskey-archive-downloader.exe` を開きます。インストールは不要です
            - `macos-arm64.dmg` … macOS（Apple Silicon）版
            - `macos-x64.dmg` … macOS（Intel）版
            - `index.html.zip` … 差し替え用のビューア。解凍した `index.html` を、作成済みのアーカイブの `index.html` と差し替えると、作り直さずにビューアだけ新しくできます

            ## 初めて開くとき

            - Windows: 署名していないので、SmartScreen の警告が出ることがあります。「詳細情報」→「実行」で開けます
            - macOS: Apple の公証を受けていないので、警告が出ます。次のどちらかで開けます
              - 一度開こうとしたあと、「システム設定」→「プライバシーとセキュリティ」→「このまま開く」
              - ターミナルで `xattr -dr com.apple.quarantine "/Applications/Misskey Archive Downloader.app"`
          prerelease: false
          make_latest: true
          files: release/*
